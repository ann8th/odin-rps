<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <h1>A Rock Paper Scissors GAME</h1>
    <div class="game-container">

        <div class="game-status">
            <div>COMPUTER: <span class="computer"></span> </div>
            <div>HUMAN: <span class="human"></span> </div>
        </div>

        <div class="game-space">
          VS
        </div>
        
        <div class="game-btns">
            <div class="btns">
                <button class="btn rock-btn">
                    <img src="./imgs/rock.svg" alt="rock-image" width="70">
                    ROCK
                </button>
                <button class="btn paper-btn">
                    <img src="./imgs/paper.svg" alt="paper-image" width="70">
                    PAPER
                </button>
                <button class="btn scissors-btn">
                    <img src="./imgs/scissors.svg" alt="scissors-image" width="70">
                    SCISSORS
                </button>
            </div>
            <p>CHOOSE YOUR WEAPON!</p>
        </div>

    </div>
    
</body>
</html>
